name: network-observer-gateway-agent

services:
  gateway-agent:
    image: ghcr.io/jonysun/network-observer-agent:${NETWORK_OBSERVER_VERSION:-v0.3.5}
    restart: unless-stopped
    command: ["run", "--config", "/etc/network-observer/gateway.json"]
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config:/etc/network-observer:ro
      - gateway-wal:/var/lib/network-observer
      - /sys:/sys:ro
    network_mode: host
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "test -r /etc/network-observer/gateway.json && test -w /var/lib/network-observer"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gateway-wal:
