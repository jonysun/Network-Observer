services:
  postgres:
    image: postgres:18.1-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: observer
      POSTGRES_DB: observer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observer -d observer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:25.10.2.65-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: observer
      CLICKHOUSE_USER: observer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=\"$$CLICKHOUSE_USER\" --password=\"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  observer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:8443
      POSTGRES_DSN: postgres://observer:${POSTGRES_PASSWORD}@postgres:5432/observer?sslmode=disable
      CLICKHOUSE_DSN: clickhouse://clickhouse:9000/observer?username=observer&password=${CLICKHOUSE_PASSWORD}
      TLS_CERT_FILE: /run/tls/server.crt
      TLS_KEY_FILE: /run/tls/server.key
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:?Set ENROLLMENT_TOKEN in .env}
      AGENT_SECURITY_MODE: ${AGENT_SECURITY_MODE:-true}
      SUMMARY_RETENTION_DAYS: ${SUMMARY_RETENTION_DAYS:-90}
      WEB_DIST_DIR: /app/web/dist
    volumes:
      - ./deploy/tls:/run/tls:ro
    ports:
      - "${AGENT_GRPC_PORT:-8444}:8443"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      observer:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - observer
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.10.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)(/|$)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - "9100"

  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
