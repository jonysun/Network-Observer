services:
  postgres:
    image: postgres:18.1-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: observer
      POSTGRES_DB: observer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observer -d observer"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:25.10.2.65-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: observer
      CLICKHOUSE_USER: observer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/config.d/observer-memory.xml:/etc/clickhouse-server/config.d/observer-memory.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=\"$$CLICKHOUSE_USER\" --password=\"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  observer:
    image: ghcr.io/jonysun/network-observer:v0.3.28
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: false
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:8443
      GRPC_INSECURE_ADDR: ${GRPC_INSECURE_ADDR:-}
      POSTGRES_DSN: postgres://observer:${POSTGRES_PASSWORD}@postgres:5432/observer?sslmode=disable
      CLICKHOUSE_DSN: clickhouse://clickhouse:9000/observer?username=observer&password=${CLICKHOUSE_PASSWORD}
      TLS_CERT_FILE: /run/tls/server.crt
      TLS_KEY_FILE: /run/tls/server.key
      TLS_CERT_HOST: ${TLS_CERT_HOST:-observer.example.lan}
      TLS_CERT_SEED_DIR: /run/tls-seed
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      SUMMARY_RETENTION_DAYS: ${SUMMARY_RETENTION_DAYS:-90}
      IP_ENRICHMENT_ASN_MMDB: ${IP_ENRICHMENT_ASN_MMDB:-}
      IP_ENRICHMENT_CITY_MMDB: ${IP_ENRICHMENT_CITY_MMDB:-}
      IP_ENRICHMENT_DATA_DIR: /data/enrichment
      WEB_DIST_DIR: /app/web/dist
    volumes:
      - type: volume
        source: tls-data
        target: /run/tls
        read_only: false
      - ./deploy/tls:/run/tls-seed:ro
      - enrichment-data:/data/enrichment
    ports:
      - "${AGENT_GRPC_PORT:-8444}:8443"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8443}:443"
      - "${CENTER_BOOTSTRAP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tls-data:/etc/nginx/tls:ro
    depends_on:
      observer:
        condition: service_healthy

volumes:
  postgres-data:
  clickhouse-data:
  enrichment-data:
  tls-data:
