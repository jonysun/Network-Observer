name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jonysun/network-observer

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: amd64
          - goarch: arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Agent
        env:
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -trimpath -ldflags='-s -w' -o network-observer-agent-linux-${{ matrix.suffix }} ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.suffix }}
          path: network-observer-agent-linux-${{ matrix.suffix }}
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}
          flavor: latest=false
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_PREFIX }}-agent:${{ github.ref_name }}
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/install-agent.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum network-observer-agent-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            network-observer-agent-linux-*
            SHA256SUMS
            scripts/install-agent.sh
          generate_release_notes: true
