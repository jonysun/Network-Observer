name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jonysun/network-observer

jobs:
  binaries:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: amd64
            bpf_arch: x86
          - goarch: arm64
            suffix: arm64
            bpf_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/.*network-observer:${NETWORK_OBSERVER_VERSION:-\(v[0-9.]*\)}.*/\1/p' examples/center/light/docker-compose.yml | head -n 1)"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Agent
        env:
          GOARCH: ${{ matrix.goarch }}
          AGENT_VERSION: ${{ steps.version.outputs.value }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -trimpath -ldflags="-s -w -X github.com/network-observer/network-observer/internal/agent.agentVersion=${AGENT_VERSION}" -o network-observer-agent-linux-${{ matrix.suffix }} ./cmd/agent
      - name: Build native eBPF object
        env:
          BPF_ARCH: ${{ matrix.bpf_arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
          clang -O2 -g -target bpf -D__TARGET_ARCH_${BPF_ARCH} \
            -I/usr/include -I"/usr/include/$(gcc -print-multiarch)" \
            -c internal/agent/bpf/flow_counter.c \
            -o network-observer-flow-counter-linux-${{ matrix.suffix }}.o
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.suffix }}
          path: |
            network-observer-agent-linux-${{ matrix.suffix }}
            network-observer-flow-counter-linux-${{ matrix.suffix }}.o
  images:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    needs: [openwrt-lite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/.*network-observer:${NETWORK_OBSERVER_VERSION:-\(v[0-9.]*\)}.*/\1/p' examples/center/light/docker-compose.yml | head -n 1)"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: agent-openwrt-lite
          path: deploy/bootstrap/openwrt/${{ steps.version.outputs.value }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            AGENT_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ env.IMAGE_PREFIX }}-agent:${{ steps.version.outputs.value }}
  openwrt-lite:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/.*network-observer:${NETWORK_OBSERVER_VERSION:-\(v[0-9.]*\)}.*/\1/p' examples/center/light/docker-compose.yml | head -n 1)"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build OpenWrt ARM64 Gateway Lite
        env:
          AGENT_VERSION: ${{ steps.version.outputs.value }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags openwrtlite -trimpath -ldflags="-s -w -X github.com/network-observer/network-observer/internal/agent.agentVersion=${AGENT_VERSION}" -o network-observer-agent-openwrt-linux-arm64 ./cmd/agent
      - name: Build OpenWrt ARMv7 Gateway Lite
        env:
          AGENT_VERSION: ${{ steps.version.outputs.value }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -tags openwrtlite -trimpath -ldflags="-s -w -X github.com/network-observer/network-observer/internal/agent.agentVersion=${AGENT_VERSION}" -o network-observer-agent-openwrt-linux-armv7 ./cmd/agent
      - name: Prepare bootstrap assets
        run: |
          sha256sum network-observer-agent-openwrt-linux-* > SHA256SUMS
          cp scripts/install-agent-openwrt.sh install-agent-openwrt.sh
          cp scripts/uninstall-agent.sh uninstall-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-openwrt-lite
          path: |
            network-observer-agent-openwrt-linux-*
            SHA256SUMS
            install-agent-openwrt.sh
            uninstall-agent.sh
  publish:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    needs: [binaries, openwrt-lite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/install-agent.sh
            scripts/install-agent-openwrt.sh
            scripts/network-observer
            scripts/uninstall-agent.sh
            scripts/upgrade-agent.sh
            examples/center/light/docker-compose.yml
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/.*network-observer:${NETWORK_OBSERVER_VERSION:-\(v[0-9.]*\)}.*/\1/p' examples/center/light/docker-compose.yml | head -n 1)"
          fi
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
      - name: Prepare native management assets
        run: |
          cp scripts/network-observer network-observer
          cp scripts/install-agent.sh install-agent.sh
          cp scripts/install-agent-openwrt.sh install-agent-openwrt.sh
          cp scripts/uninstall-agent.sh uninstall-agent.sh
          cp scripts/upgrade-agent.sh upgrade-agent.sh
          chmod 0755 network-observer install-agent.sh install-agent-openwrt.sh uninstall-agent.sh upgrade-agent.sh
      - name: Checksums
        run: sha256sum network-observer install-agent.sh install-agent-openwrt.sh uninstall-agent.sh upgrade-agent.sh network-observer-agent-linux-* network-observer-agent-openwrt-linux-* network-observer-flow-counter-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            network-observer-agent-linux-*
            network-observer-agent-openwrt-linux-*
            network-observer-flow-counter-linux-*
            SHA256SUMS
            network-observer
            install-agent.sh
            install-agent-openwrt.sh
            uninstall-agent.sh
            upgrade-agent.sh
          generate_release_notes: true
