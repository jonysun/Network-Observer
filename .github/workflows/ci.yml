name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_TEST_DSN: postgres://observer:ci-password@localhost:5432/observer?sslmode=disable
    services:
      postgres:
        image: postgres:18.1-alpine3.22
        env:
          POSTGRES_USER: observer
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: observer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observer -d observer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests and vet
        run: |
          go test ./...
          go vet ./...
      - name: Web build
        working-directory: web
        run: npm ci && npm run build
      - name: Compose validation
        run: |
          cp .env.example .env
          docker compose -f docker-compose.light.yml config
          GRAFANA_ADMIN_PASSWORD=ci-password docker compose -f docker-compose.light.yml -f docker-compose.pro.yml config
          docker compose --env-file .env -f examples/center/light/docker-compose.yml config
          GRAFANA_ADMIN_PASSWORD=ci-password docker compose --env-file .env -f examples/center/light/docker-compose.yml -f examples/center/pro/docker-compose.yml config
          docker compose --env-file .env -f examples/agent/docker-compose.yml config
          docker compose --env-file .env -f examples/agent/gateway-docker-compose.yml config
          if grep -R -n -E '^[[:space:]]*build:' examples --include='*.yml' --include='*.yaml'; then
            echo 'GHCR example Compose files must use published images, not local builds.' >&2
            exit 1
          fi
      - name: Installer syntax
        run: |
          bash -n scripts/install-agent.sh
          sh -n scripts/install-agent-openwrt.sh
          sh -n scripts/uninstall-agent.sh
          sh -n scripts/test-uninstall-agent.sh
          bash -n scripts/upgrade-agent.sh
          sudo sh scripts/test-uninstall-agent.sh
      - name: OpenWrt Lite cross-build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags openwrtlite -trimpath -o /tmp/network-observer-agent-openwrt-arm64 ./cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -tags openwrtlite -trimpath -o /tmp/network-observer-agent-openwrt-armv7 ./cmd/agent
