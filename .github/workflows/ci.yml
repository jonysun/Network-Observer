name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests and vet
        run: |
          go test ./...
          go vet ./...
      - name: Web build
        working-directory: web
        run: npm ci && npm run build
      - name: Compose validation
        run: |
          cp .env.example .env
          docker compose -f docker-compose.light.yml config
          GRAFANA_ADMIN_PASSWORD=ci-password docker compose -f docker-compose.light.yml -f docker-compose.pro.yml config
          docker compose -f examples/center/light/docker-compose.yml config
          GRAFANA_ADMIN_PASSWORD=ci-password docker compose -f examples/center/light/docker-compose.yml -f examples/center/pro/docker-compose.yml config
          docker compose -f examples/agent/docker-compose.yml config
          docker compose -f examples/agent/gateway-docker-compose.yml config
          if grep -R -n -E '^[[:space:]]*build:' examples --include='*.yml' --include='*.yaml'; then
            echo 'GHCR example Compose files must use published images, not local builds.' >&2
            exit 1
          fi
      - name: Installer syntax
        run: bash -n scripts/install-agent.sh
