services:
  endpoint-agent:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    restart: unless-stopped
    command: ["run", "--config", "/etc/network-observer/agent.json"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ./config:/etc/network-observer:ro
      - agent-wal:/var/lib/network-observer
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    network_mode: host
    pid: host
    healthcheck:
      test: ["CMD-SHELL", "test -r /etc/network-observer/agent.json && test -w /var/lib/network-observer"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-wal:
