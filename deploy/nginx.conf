map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Plaintext bootstrap listener. It exposes only fixed OpenWrt release assets;
# the HTTPS listener below remains the Center UI/API endpoint.
server {
    listen 80;
    server_name _;

    location /bootstrap/openwrt/ {
        proxy_pass http://observer:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_read_timeout 2m;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;

    location / {
        proxy_pass http://observer:8080;
        proxy_http_version 1.1;
        # Preserve the public port so Gorilla's WebSocket Origin check sees
        # the same host:port that the browser used for the HTTPS page.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
